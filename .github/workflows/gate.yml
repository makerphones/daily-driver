# Printability gate — runs on every push and PR (including forks' PRs), so an
# unprintable part fails CI before anyone wastes filament.
#
# Core deps ONLY (requirements.txt). The render/viewer extras (matplotlib,
# ocp_vscode) are deliberately NOT installed — no check needs them, and keeping
# CI to the core deps matches the repo's pure-build convention.
name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"        # repo is on 3.13 (cadquery-ocp wheels cp310–cp313)

      - name: Install core build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build all parts + assembly
        run: python build.py            # render skips cleanly (no matplotlib in CI)

      - name: Run printability gate
        run: python gate.py             # non-zero exit on any HARD failure
