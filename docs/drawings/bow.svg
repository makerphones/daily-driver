<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <style>
    .sub{fill:#64748b;font-size:11px}
    .dim{fill:#475569;font-size:11px}
    .dimline{stroke:#94a3b8;stroke-width:0.9}
    .note{fill:#ea580c;font-size:11px;font-weight:600}
    .vt{fill:#2d3748;font-size:13px;font-weight:700}
    .tbd{fill:#ea580c;font-size:12px;font-weight:700}
  </style>

  <text x="36" y="40" fill="#2d3748" font-size="22" font-weight="700">Head bow — spring steel</text>
  <text x="36" y="60" class="sub">BOUGHT (Beyer Metal Head Bow drop-in) · or DIY 1095 to same geometry · first-pass, not to scale</text>
  <line x1="36" y1="72" x2="684" y2="72" stroke="#2d3748" stroke-width="1.2"/>

  <!-- formed arc -->
  <text x="360" y="108" class="vt" text-anchor="middle">formed arc (side)</text>
  <path d="M120 280 Q360 80 600 280" fill="none" stroke="#2d3748" stroke-width="6"/>
  <!-- sliders riding it -->
  <rect x="150" y="232" width="38" height="20" rx="4" fill="#f1f5f9" stroke="#2d3748" stroke-width="1.6"/>
  <rect x="532" y="232" width="38" height="20" rx="4" fill="#f1f5f9" stroke="#2d3748" stroke-width="1.6"/>
  <text x="169" y="270" class="sub" text-anchor="middle">slider</text>
  <text x="551" y="270" class="sub" text-anchor="middle">slider</text>
  <!-- radius callout -->
  <line x1="360" y1="160" x2="360" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="372" y="220" class="tbd">arc radius — TBD from measured part</text>
  <!-- developed length -->
  <line x1="120" y1="312" x2="600" y2="312" class="dimline"/>
  <line x1="120" y1="306" x2="120" y2="318" class="dimline"/>
  <line x1="600" y1="306" x2="600" y2="318" class="dimline"/>
  <text x="360" y="330" class="tbd" text-anchor="middle">developed (flat) length — TBD from measured part</text>

  <!-- cross-section -->
  <text x="200" y="372" class="vt" text-anchor="middle">section</text>
  <g transform="translate(150,384)">
    <rect x="0" y="0" width="100" height="9" fill="#e2e8f0" stroke="#2d3748" stroke-width="1.4"/>
    <line x1="0" y1="22" x2="100" y2="22" class="dimline"/>
    <text x="50" y="36" class="dim" text-anchor="middle">width ~10 mm</text>
    <line x1="116" y1="0" x2="116" y2="9" class="dimline"/>
    <text x="122" y="8" class="dim">~0.7</text>
  </g>

  <!-- sourcing box -->
  <rect x="380" y="356" width="300" height="64" rx="6" fill="#fff7ef" stroke="#ea580c" stroke-width="1.2"/>
  <text x="396" y="378" class="note">Beyerdynamic Metal Head Bow — ~$11, drop-in</text>
  <text x="396" y="396" class="sub">north-america.beyerdynamic.com/p/metal-head-bow</text>
  <text x="396" y="412" class="sub">DIY: 1095 laser-cut flat, formed cold over a jig</text>

  <text x="36" y="446" class="sub">makerphones · Warren Labs — drawings/bow.svg — slider + jig geometry come from the real bow</text>
</svg>
